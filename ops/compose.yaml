services:
  portfolio:
    image: nginx@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    container_name: monitor5-portfolio
    restart: unless-stopped
    user: "101:101"
    read_only: true
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.50
    ports:
      - "127.0.0.1:4387:8080"
    volumes:
      - ./site:/srv/portfolio:ro
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
