# Host Nginx fragment for a server shared with other applications.
# Install as a separate enabled site; retain the host's existing nginx.conf.
server {
    listen 127.0.0.1:4387;
    server_name daus.uk;
    root /opt/monitor5-portfolio/site/current;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Portfolio-Origin galmegi-temporary always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "ok\n";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # A location's add_header directives replace inherited headers.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ~ (^|/)\. {
        return 404;
    }
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
