# Optional public vhost for daus.uk on a shared Nginx host.
# Requires nginx.shared.conf to be enabled separately on 127.0.0.1:4387.
# Install only after provisioning a certificate covering daus.uk. With a
# Cloudflare Origin CA certificate, keep the DNS proxy and Full (strict) TLS.
server {
    listen 80;
    server_name daus.uk;
    return 301 https://daus.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name daus.uk;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/daus.uk/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/daus.uk/private.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Reuse the isolated origin's SPA routing, cache policy and response headers.
    location / {
        proxy_pass http://127.0.0.1:4387;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
